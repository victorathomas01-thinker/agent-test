name: Windows public feed validation
on:
  push:
    branches: [validation/windows-public-feeds]
    paths: [.github/workflows/windows-public-feed-validation.yml]
permissions:
  contents: read
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify two official public job feeds
        run: python -m scripts.probe_public_ats
      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Rehearse application with synthetic data
        run: python main.py rehearse-submit
