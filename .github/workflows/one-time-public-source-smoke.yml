name: One-time Greenhouse custom-domain source verification

# A deliberately one-time, path-gated probe. Normal pushes and PRs do NOT
# trigger public network requests. Re-trigger only by explicitly editing
# this workflow file in its dedicated review branch.
on:
  push:
    branches:
      - feature/live-source-validation-2026-11-12
    paths:
      - .github/workflows/one-time-public-source-smoke.yml

permissions:
  contents: read

concurrency:
  group: one-time-public-source-smoke
  cancel-in-progress: true

jobs:
  verify-official-ats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Duolingo approved custom domain and Lever baseline (4 URLs each max)
        run: python -m scripts.probe_public_ats
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
